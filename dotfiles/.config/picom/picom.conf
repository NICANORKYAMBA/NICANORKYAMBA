# picom: DarkMint glass effects (rounded corners, blur, shadows, fades)
# Started by ~/.local/bin/fx-on, stopped by ~/.local/bin/fx-off

backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;   # full-screen video/games bypass the compositor

# ─── Rounded corners ───
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Conky'",
  "class_g = 'Xfdesktop'"
];

# ─── Frosted glass blur behind transparent windows (terminals, menus) ───
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "class_g = 'flameshot'",
  "_GTK_FRAME_EXTENTS@"
];

# ─── Soft shadows ───
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "class_g = 'Conky'",
  "class_g = 'flameshot'",
  "_GTK_FRAME_EXTENTS@"
];

# ─── Smooth fades ───
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};
