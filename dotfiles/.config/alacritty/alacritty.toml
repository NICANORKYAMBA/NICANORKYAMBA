[env]
TERM = "xterm-256color"

[window]
opacity = 0.92
blur = true
padding = { x = 12, y = 10 }
dynamic_padding = true
decorations = "full"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.5

[font.glyph_offset]
x = 0
y = 1

# DarkMint Neon: matches the DarkMint GTK theme (#133D17 selection green)
[colors.primary]
background = "#0b110d"
foreground = "#18f018"

[colors.cursor]
text   = "#0b110d"
cursor = "#39d98a"

[colors.selection]
text       = "#f2fff4"
background = "#1e5a27"

[colors.normal]
black   = "#1a221c"
red     = "#ff5c6c"
green   = "#39d98a"
yellow  = "#e6c46a"
blue    = "#4fa3ff"
magenta = "#c678dd"
cyan    = "#2ee6c5"
white   = "#c9d6cc"

[colors.bright]
black   = "#3a4a3e"
red     = "#ff7b88"
green   = "#5dffa8"
yellow  = "#ffd97a"
blue    = "#7cbcff"
magenta = "#dd9cf0"
cyan    = "#6bfde0"
white   = "#f2fff4"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600

[bell]
animation = "EaseOutExpo"
duration = 0

[selection]
save_to_clipboard = true

[scrolling]
history = 10000
