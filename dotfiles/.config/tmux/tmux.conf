# tmux · DarkMint Neon
# Prefix stays Ctrl+b. Split: prefix + | and prefix + -. Reload: prefix + r.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ─── Colours ───
set -g status-style "bg=#0b110d,fg=#8fa894"
set -g message-style "bg=#133D17,fg=#5dffa8,bold"
set -g mode-style "bg=#133D17,fg=#f2fff4"
set -g pane-border-style "fg=#1f3324"
set -g pane-active-border-style "fg=#39d98a"
set -g display-panes-active-colour "#5dffa8"
set -g display-panes-colour "#2f6b45"
setw -g clock-mode-colour "#5dffa8"

# ─── Status bar ───
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 90
set -g status-left "#[bg=#39d98a,fg=#0b110d,bold] 󰆍 #S #[bg=#0b110d,fg=#39d98a]#[default] "
setw -g window-status-format "#[fg=#4a6b52] #I #[fg=#8fa894]#W "
setw -g window-status-current-format "#[bg=#133D17,fg=#5dffa8,bold] #I #[fg=#d6e5d8]#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""
set -g status-right "#[fg=#2ee6c5]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | sed 's/^/󰘬 /') #[fg=#4a6b52]│ #[fg=#8fa894]%a %d %b #[fg=#4a6b52]│ #[fg=#5dffa8,bold]%H:%M "
