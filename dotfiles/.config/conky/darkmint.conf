-- DarkMint Neon system dashboard
conky.config = {
    alignment = 'top_right',
    gap_x = 28,
    gap_y = 60,
    minimum_width = 300,
    maximum_width = 300,

    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=9',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    default_outline_color = '1f3324',
    default_bar_height = 4,
    default_graph_height = 26,

    update_interval = 1.5,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    top_name_width = 18,

    default_color = 'c9d6cc',
    color1 = '39d98a',   -- DarkMint green
    color2 = '5dffa8',   -- neon accent
    color3 = '4a6b52',   -- dim labels / rules
    color4 = '2ee6c5',   -- cyan
    color5 = 'ff5c6c',   -- alert red
};

conky.text = [[
${font JetBrainsMono Nerd Font:bold:size=30}${color2}${time %H:%M}${font}${color3}${voffset -22}${goto 140}${color}${time %A}
${goto 140}${color3}${time %d %B %Y}
${voffset 4}${color3}${hr 1}
${color1}󰌢  ${color}${nodename}${alignr}${color3}${kernel}
${color1}󰔟  ${color}uptime${alignr}${uptime_short}
${color1}󰁹  ${color}battery${alignr}${battery_percent BAT0}%  ${color1}${battery_bar 4,80 BAT0}

${color2}${font JetBrainsMono Nerd Font:bold:size=9}SYSTEM ${color3}${hr 1}${font}
${color1}󰻠  ${color}cpu${alignr}${cpu cpu0}%  ${color3}${execi 5 sensors k10temp-pci-00c3 2>/dev/null | awk '/Tctl/{print $2}'}
${color1}${cpugraph cpu0 26,300 133D17 39d98a -t}
${color1}󰍛  ${color}ram${alignr}${mem} / ${memmax}
${color1}${membar 4,300}
${color1}󰋊  ${color}disk /${alignr}${fs_used /} / ${fs_size /}
${color1}${fs_bar 4,300 /}

${color2}${font JetBrainsMono Nerd Font:bold:size=9}NETWORK ${color3}${hr 1}${font}
${if_up wlan0}${color1}󰖩  ${color}${wireless_essid wlan0}${alignr}${color4}${addr wlan0}
${color1}󰇚  ${color}${downspeed wlan0}${goto 160}${color1}󰕒  ${color}${upspeed wlan0}
${color1}${downspeedgraph wlan0 22,145 133D17 39d98a}${goto 160}${upspeedgraph wlan0 22,140 133D17 2ee6c5}${else}${color5}󰖪  wlan0 offline${endif}
${if_up tun0}${color1}󰖂  ${color}vpn${alignr}${color2}${addr tun0}${else}${color1}󰖂  ${color}vpn${alignr}${color3}disconnected${endif}

${color2}${font JetBrainsMono Nerd Font:bold:size=9}DEVOPS ${color3}${hr 1}${font}
${color1}󰡨  ${color}docker${alignr}${execi 15 docker ps -q 2>/dev/null | wc -l} running ${color3}/ ${execi 30 docker ps -aq 2>/dev/null | wc -l}
${color1}󱃾  ${color}k8s${alignr}${color4}${execi 30 timeout 3 kubectl config current-context 2>/dev/null || echo none}
${color1}󰸏  ${color}aws${alignr}${execi 30 echo ${AWS_PROFILE:-default}}

${color2}${font JetBrainsMono Nerd Font:bold:size=9}TOP ${color3}${hr 1}${font}
${color}${top name 1}${alignr}${color1}${top cpu 1}%
${color}${top name 2}${alignr}${color1}${top cpu 2}%
${color}${top name 3}${alignr}${color1}${top cpu 3}%
]];
