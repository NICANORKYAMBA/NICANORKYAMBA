<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Multi-environment AWS vendor platform in Terraform: users reach CloudFront with WAF, then an ALB and API Gateway; ECS Fargate on Graviton and Lambda run the services; data in RDS MySQL through RDS Proxy, ElastiCache and S3; messaging with SQS FIFO, EventBridge and SES; security with GuardDuty, Inspector, AWS Config and CloudTrail alarms; observability with Datadog, CloudWatch and X-Ray. One Terraform country stack is deployed through thin roots per environment, staging at 417 resources with zero drift and production at 202, with state backed up encrypted to a second region.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39d98a"/></marker>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#39d98a" stroke-opacity="0.04"/></pattern>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace; }
      .t  { font-size: 19px; font-weight: 700; fill: #5dffa8; }
      .st { font-size: 12.5px; fill: #8fa894; }
      .h  { font-size: 13px; font-weight: 700; fill: #d6e5d8; }
      .s  { font-size: 11px; fill: #8fa894; }
      .n  { font-size: 22px; font-weight: 700; fill: #5dffa8; }
      .zone { font-size: 11px; font-weight: 700; fill: #39d98a; letter-spacing: 1.5px; }
      .box { fill: #0f1a13; stroke: #2f6b45; stroke-width: 1.2; }
      .hot { fill: #133D17; stroke: #39d98a; stroke-width: 1.2; }
      .ln { stroke: #39d98a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .ln2 { stroke: #39d98a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="560" rx="16" fill="#0b110d"/>
  <rect width="1000" height="560" rx="16" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="999" height="559" rx="16" fill="none" stroke="#39d98a" stroke-opacity="0.22"/>

  <text x="30" y="40" class="t">Vendor platform on AWS · fully in Terraform</text>
  <text x="30" y="62" class="st">East African beverage group · staging + production accounts · eu-west-1</text>

  <!-- request path -->
  <text x="30" y="104" class="zone">EDGE</text>
  <rect x="30" y="116" width="170" height="62" rx="10" class="box"/>
  <text x="46" y="142" class="h">Users · vendors</text>
  <text x="46" y="162" class="s">web, mobile, partners</text>

  <rect x="230" y="116" width="200" height="62" rx="10" class="hot"/>
  <text x="246" y="142" class="h">CloudFront + WAF</text>
  <text x="246" y="162" class="s">ACM TLS · managed rules</text>

  <rect x="460" y="116" width="230" height="62" rx="10" class="box"/>
  <text x="476" y="142" class="h">ALB · API Gateway</text>
  <text x="476" y="162" class="s">HTTP · REST · WebSocket</text>

  <path d="M200 147H226" class="ln"/>
  <path d="M430 147H456" class="ln"/>

  <text x="30" y="214" class="zone">COMPUTE</text>
  <rect x="460" y="226" width="230" height="62" rx="10" class="hot"/>
  <text x="476" y="252" class="h">ECS Fargate · Graviton</text>
  <text x="476" y="272" class="s">containers, deployed by CI</text>
  <rect x="230" y="226" width="200" height="62" rx="10" class="box"/>
  <text x="246" y="252" class="h">Lambda · ARM64</text>
  <text x="246" y="272" class="s">event handlers</text>
  <path d="M575 178V222" class="ln"/>
  <path d="M460 257H434" class="ln"/>

  <text x="30" y="324" class="zone">DATA</text>
  <rect x="30" y="336" width="200" height="62" rx="10" class="box"/>
  <text x="46" y="362" class="h">SQS · EventBridge</text>
  <text x="46" y="382" class="s">FIFO, pipes · SES</text>
  <rect x="245" y="336" width="185" height="62" rx="10" class="box"/>
  <text x="261" y="362" class="h">ElastiCache</text>
  <text x="261" y="382" class="s">Redis · rotation</text>
  <rect x="460" y="336" width="230" height="62" rx="10" class="box"/>
  <text x="476" y="362" class="h">RDS MySQL</text>
  <text x="476" y="382" class="s">through RDS Proxy · S3</text>
  <path d="M575 288V332" class="ln"/>
  <path d="M520 288L360 332" class="ln"/>
  <path d="M330 288L140 332" class="ln"/>

  <!-- security + observability -->
  <text x="30" y="434" class="zone">SECURITY · OBSERVABILITY</text>
  <rect x="30" y="446" width="400" height="80" rx="10" class="box"/>
  <text x="46" y="472" class="h">GuardDuty · Inspector · AWS Config</text>
  <text x="46" y="492" class="s">CloudTrail security alarms · Secrets Manager rotation</text>
  <text x="46" y="510" class="s">least-privilege IAM · scoped DB users</text>
  <rect x="460" y="446" width="230" height="80" rx="10" class="box"/>
  <text x="476" y="472" class="h">Datadog · CloudWatch</text>
  <text x="476" y="492" class="s">X-Ray · DB monitoring</text>
  <text x="476" y="510" class="s">cost anomaly detection</text>

  <!-- terraform column -->
  <rect x="720" y="96" width="252" height="430" rx="14" fill="#0d1610" stroke="#39d98a" stroke-opacity="0.55" stroke-width="1.4"/>
  <text x="738" y="122" class="zone">TERRAFORM</text>
  <rect x="738" y="136" width="216" height="62" rx="10" class="hot"/>
  <text x="754" y="162" class="h">stacks/country-platform</text>
  <text x="754" y="182" class="s">everything, written once</text>
  <path d="M846 198V214" class="ln"/>
  <rect x="738" y="218" width="104" height="96" rx="10" class="box"/>
  <text x="752" y="242" class="s">staging</text>
  <text x="752" y="270" class="n">417</text>
  <text x="752" y="294" class="s">zero drift</text>
  <rect x="850" y="218" width="104" height="96" rx="10" class="box"/>
  <text x="864" y="242" class="s">production</text>
  <text x="864" y="270" class="n">202</text>
  <text x="864" y="294" class="s">resources</text>

  <rect x="738" y="330" width="216" height="62" rx="10" class="box"/>
  <text x="754" y="356" class="h">State + config backup</text>
  <text x="754" y="376" class="s">encrypted · second region</text>

  <rect x="738" y="408" width="216" height="100" rx="10" class="box"/>
  <text x="754" y="432" class="h">Disaster recovery</text>
  <text x="754" y="456" class="n">30m / 15m</text>
  <text x="754" y="480" class="s">RTO / RPO target</text>
  <text x="754" y="496" class="s">position documented</text>

  <path d="M716 300H694" class="ln2"/>
</svg>
